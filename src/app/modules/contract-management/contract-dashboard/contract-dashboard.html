<div class="cm-root">

  <div class="stats-grid">
    <div class="stat-card" *ngFor="let s of stats">
      <div class="top-row">
        <div class="stat-icon" [ngClass]="s.color">
          <svg *ngIf="s.icon==='file'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <svg *ngIf="s.icon==='check'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
          <svg *ngIf="s.icon==='clock'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <svg *ngIf="s.icon==='shield'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
        </div>
        <div class="stat-trend" [ngClass]="s.trendUp ? 'up' : 'down'">{{ s.trend }}</div>
      </div>
      <div class="stat-value">{{ s.value }}</div>
      <div class="stat-label">{{ s.label }}</div>
    </div>
  </div>

  <div class="alert-banner">
    <div class="a-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
    </div>
    <div class="a-text">
      <div class="a-title">64 contracts expiring within 30 days</div>
      <div class="a-sub">Review renewal terms now to avoid service gaps or automatic rollovers on unfavorable terms.</div>
    </div>
    <button class="btn" [routerLink]="['/contract-management/contract-renewal']">Review Now</button>
  </div>

  <div class="grid-2">
    <div class="table-card">
      <div class="table-card-head"><h3>Recent Contract Activity</h3></div>
      <div style="padding:22px 24px;">
        <div class="timeline-item" *ngFor="let a of recentActivity">
          <div class="timeline-dot" [style.background]="a.color" [style.border-color]="'transparent'"></div>
          <div class="timeline-body">
            <div class="t-title">{{ a.title }}</div>
            <div class="t-date">{{ a.time }}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="vd-panel" style="margin-bottom:0;">
      <h4>Contracts by Category</h4>
      <div class="metric-row" *ngFor="let c of categoryBreakdown">
        <div class="m-label">{{ c.label }}</div>
        <div class="m-bar"><div class="m-fill" [style.width.%]="c.percent" [style.background]="c.color"></div></div>
        <div class="m-val">{{ c.count }}</div>
      </div>
    </div>
  </div>

</div>
