<div class="tabs-container">

    <button
        *ngFor="let tab of tabs; let i = index"
        type="button"
        class="pill"
        [class.active]="selectedIndex === i"
        (click)="changeTab(i)">

        <span class="icon">
            {{ tab.icon }}
        </span>

        <span>
            {{ tab.label }}
        </span>

    </button>

</div>
