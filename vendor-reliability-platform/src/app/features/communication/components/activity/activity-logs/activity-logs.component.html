<div class="activity-page">

    <div class="header">

        <h2>Activity Logs</h2>

        <input
            placeholder="Search activity...">

    </div>

    <table>

        <thead>

            <tr>

                <th>User</th>

                <th>Action</th>

                <th>Module</th>

                <th>Time</th>

            </tr>

        </thead>

        <tbody>

            @for(log of logs;track log.id){

            <tr>

                <td>{{log.user}}</td>

                <td>{{log.action}}</td>

                <td>{{log.module}}</td>

                <td>{{log.time}}</td>

            </tr>

            }

        </tbody>

    </table>

</div>
