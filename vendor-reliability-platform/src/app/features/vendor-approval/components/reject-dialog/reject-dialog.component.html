<h2 mat-dialog-title>

    Reject Vendor

</h2>

<mat-dialog-content>

    <p>

        Please provide a reason for rejecting this vendor.

    </p>

    <mat-form-field appearance="outline">

        <mat-label>Reason</mat-label>

        <form [formGroup]="form">

            <mat-form-field appearance="outline">

            <textarea
                matInput
                rows="6"
                maxlength="500"
                formControlName="reason">
            </textarea>

            </mat-form-field>

        </form>

        <mat-hint align="end">

            {{ form.controls.reason.value?.length || 0 }}/500

        </mat-hint>

        <mat-error *ngIf="form.controls.reason.hasError('required')">

            Reason is required.

        </mat-error>

        <mat-error *ngIf="form.controls.reason.hasError('minlength')">

            Minimum 10 characters required.

        </mat-error>

    </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-button
        (click)="cancel()">

        Cancel

    </button>

    <button
        mat-flat-button
        color="warn"
        (click)="submit()">

        Reject Vendor

    </button>

</mat-dialog-actions>
