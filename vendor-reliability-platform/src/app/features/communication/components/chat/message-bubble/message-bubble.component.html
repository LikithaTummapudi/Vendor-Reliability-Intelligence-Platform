<div
    class="message-wrapper"
    [class.mine]="message.mine">

    <div class="avatar">

        {{ message.senderAvatar }}

    </div>

    <div class="bubble">

        <div class="sender">

            {{ message.sender }}

        </div>

        <div
            class="text"
            *ngIf="message.text">

            {{ message.text }}

        </div>

        <div
            class="attachment"
            *ngIf="message.attachment">

            <mat-icon>

                attach_file

            </mat-icon>

            <span>

                {{ message.attachment.fileName }}

            </span>

        </div>

        <div class="time">

            {{ message.sentAt }}

        </div>

    </div>

</div>
