<div class="composer">

    <textarea

    [(ngModel)]="message"

    placeholder="Type a message or @mention someone...">

    </textarea>

    <div class="toolbar">

        <div class="left">

            <button mat-icon-button>

                <mat-icon>

                    attach_file

                </mat-icon>

            </button>

            <button mat-icon-button>

                <mat-icon>

                    sentiment_satisfied

                </mat-icon>

            </button>

            <button mat-icon-button>

                <mat-icon>

                    alternate_email

                </mat-icon>

            </button>

        </div>

        <button

        mat-flat-button

        color="primary">

            Send

            <mat-icon>

                send

            </mat-icon>

        </button>

    </div>

</div>
