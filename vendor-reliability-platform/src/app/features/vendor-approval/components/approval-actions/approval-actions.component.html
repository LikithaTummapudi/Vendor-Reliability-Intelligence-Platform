<div class="action-buttons">

    <button
        mat-icon-button
        color="primary"
        matTooltip="View">

        <mat-icon>visibility</mat-icon>

    </button>

    <button
        mat-icon-button
        color="primary"
        matTooltip="Approve"
        (click)="onApprove()">

        <mat-icon>check_circle</mat-icon>

    </button>

    <button
        mat-icon-button
        color="warn"
        matTooltip="Reject"
        (click)="onReject()">

        <mat-icon>close</mat-icon>

    </button>

</div>
