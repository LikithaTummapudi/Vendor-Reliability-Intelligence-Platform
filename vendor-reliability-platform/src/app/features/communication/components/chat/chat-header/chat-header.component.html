<header class="chat-header">

    <div class="left-section">

        <div class="avatar">

            {{ conversation.avatar }}

        </div>

        <div class="info">

            <h3>{{ conversation.name }}</h3>

            <p>

                {{ conversation.company }}

                •

                <span
                    [class.online]="conversation.isOnline">

                    {{ conversation.isOnline ? 'Online' : 'Offline' }}

                </span>

            </p>

        </div>

    </div>

    <div class="actions">

        <button
            mat-icon-button
            (click)="voiceCall.emit()">

            <mat-icon>call</mat-icon>

        </button>

        <button
            mat-icon-button
            (click)="videoCall.emit()">

            <mat-icon>videocam</mat-icon>

        </button>

        <button
            mat-icon-button
            (click)="search.emit()">

            <mat-icon>search</mat-icon>

        </button>

        <button
            mat-icon-button
            (click)="moreActions.emit()">

            <mat-icon>more_vert</mat-icon>

        </button>

    </div>

</header>
