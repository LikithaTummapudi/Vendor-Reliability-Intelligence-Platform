<div
  class="sidebar"
  [class.collapsed]="collapsed">

    <!-- ==========================
         HEADER
    =========================== -->

    <div class="sidebar-header">

        <div class="brand">

            <div class="logo">

                VR

            </div>

            <div
                class="brand-info"
                *ngIf="!collapsed">

                <h2>

                    VendorHub

                </h2>

                <span>

                    Communication

                </span>

            </div>

        </div>

        <button
            mat-icon-button
            (click)="toggleSidebar()">

            <mat-icon>

                {{collapsed ? 'chevron_right' : 'chevron_left'}}

            </mat-icon>

        </button>

    </div>

    <!-- ==========================
         WORKSPACE
    =========================== -->

    <div
        class="workspace"
        *ngIf="!collapsed">

        <small>

            WORKSPACE

        </small>

        <div class="workspace-card">

            <div>

                <h3>

                    12

                </h3>

                <span>

                    Active Chats

                </span>

            </div>

            <div>

                <h3>

                    156

                </h3>

                <span>

                    Files

                </span>

            </div>

            <div>

                <h3>

                    28

                </h3>

                <span>

                    Threads

                </span>

            </div>

        </div>

    </div>

    <!-- ==========================
         NAVIGATION
    =========================== -->

    <nav>

        <a

            *ngFor="let item of menu"

            class="nav-item"

            [routerLink]="item.route"

            routerLinkActive="active">

            <mat-icon>

                {{item.icon}}

            </mat-icon>

            <span *ngIf="!collapsed">

                {{item.title}}

            </span>

        </a>

    </nav>

    <!-- ==========================
         CONTACTS
    =========================== -->

    <div
        class="contacts"
        *ngIf="!collapsed">

        <small>

            QUICK CONTACTS

        </small>

        <div
            class="contact"
            *ngFor="let person of contacts">

            <div class="avatar">

                {{person.name.charAt(0)}}

                <span
                    class="online"
                    *ngIf="person.online">

                </span>

            </div>

            <div class="contact-info">

                <strong>

                    {{person.name}}

                </strong>

                <small>

                    {{person.online ? 'Online' : 'Offline'}}

                </small>

            </div>

        </div>

    </div>

    <!-- ==========================
         FOOTER
    =========================== -->

    <div class="sidebar-footer">

        <a class="nav-item">

            <mat-icon>

                settings

            </mat-icon>

            <span *ngIf="!collapsed">

                Settings

            </span>

        </a>

        <a class="nav-item">

            <mat-icon>

                help

            </mat-icon>

            <span *ngIf="!collapsed">

                Help

            </span>

        </a>

        <a class="nav-item logout">

            <mat-icon>

                logout

            </mat-icon>

            <span *ngIf="!collapsed">

                Logout

            </span>

        </a>

    </div>

</div>
