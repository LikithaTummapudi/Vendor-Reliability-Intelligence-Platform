<div class="history-card">

    <div class="icon">

        {{ icon }}

    </div>

    <div class="content">

        <h4>

            {{ event.title }}

        </h4>

        <p>

            {{ event.description }}

        </p>

        <div class="footer">

            <span>{{ event.user }}</span>

            <span>{{ event.timestamp }}</span>

        </div>

    </div>

</div>
