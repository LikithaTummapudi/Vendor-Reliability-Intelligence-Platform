<div class="workspace-container">

    <app-communication-tabs
        [selectedIndex]="selectedTab"
        (selectedIndexChange)="onTabChanged($event)">
    </app-communication-tabs>

    <div [ngSwitch]="selectedTab">

        <!-- Vendor Messaging -->

        <div
            *ngSwitchCase="0"
            class="workspace-body">

            <aside class="left-panel">

                <app-conversation-list
                    [conversations]="conversations"
                    [selectedConversationId]="selectedConversation?.id"
                    (conversationSelected)="selectConversation($event)">
                </app-conversation-list>

            </aside>

            <main
    class="center-panel"
    *ngIf="selectedConversation">

    <app-chat-header
        [conversation]="selectedConversation">
    </app-chat-header>

    <app-message-list
        [messages]="messages">
    </app-message-list>

    <app-message-composer
        (sendMessage)="sendMessage($event)">
    </app-message-composer>

</main>

            <aside class="right-panel">

                <app-right-sidebar></app-right-sidebar>

            </aside>

        </div>

        <!-- Procurement -->

        <div
            *ngSwitchCase="1"
            class="feature-page">

            <app-discussion-threads></app-discussion-threads>

        </div>

        <!-- Files -->

        <div
            *ngSwitchCase="2"
            class="feature-page">

            <app-file-sharing></app-file-sharing>

        </div>

        <!-- History -->

        <div
            *ngSwitchCase="3"
            class="feature-page">

            <app-communication-history></app-communication-history>

        </div>

        <!-- Email -->

        <div
            *ngSwitchCase="4"
            class="feature-page">

            <app-email-notifications></app-email-notifications>

        </div>

        <!-- Activity -->

        <div
            *ngSwitchCase="5"
            class="feature-page">

            <app-activity-logs></app-activity-logs>

        </div>

    </div>

</div>
